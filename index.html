<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd or even: where to stand in pickleball doubles</title>
<meta name="description" content="Your score tells you which side you should be on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5EE; --surface:#FFFFFF; --ink:#13261C; --muted:#4A5C52; --line:#D5DED6;
  --court:#2A5DA8; --kitchen:#22508F; --surround:#3E7D5A;
  --ball:#E2EE3C; --ballEdge:#7F8A10; --them:#FF8FB1;
  --ok:#1F7A45; --okBg:#E3F3E8; --bad:#B3261E; --badBg:#FBE6E4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C15; --surface:#16281F; --ink:#E9F0EA; --muted:#A9BBB0; --line:#2B4236;
    --surround:#2F6247; --ok:#7BD69B; --okBg:#173A26; --bad:#FF9C92; --badBg:#3C1C19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C15; --surface:#16281F; --ink:#E9F0EA; --muted:#A9BBB0; --line:#2B4236;
  --surround:#2F6247; --ok:#7BD69B; --okBg:#173A26; --bad:#FF9C92; --badBg:#3C1C19;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 20px 64px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.02}
h1{font-size:clamp(2.6rem,11vw,3.6rem);margin:18px 0 14px}
h2{font-size:2rem;margin:48px 0 12px}
p{margin:0 0 14px}
.lede{font-size:1.15rem;font-weight:600}
.muted{color:var(--muted)}

.langs{display:flex;gap:6px;justify-content:flex-end}
.langs button{min-height:36px;padding:4px 10px;border-width:1px;font-size:.9rem;font-weight:600;border-radius:8px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.court-wrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.callout{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.call{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.6rem;line-height:1}
.call-label{font-size:.95rem;color:var(--muted)}
svg.court{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.p{transition:transform .6s cubic-bezier(.5,0,.2,1)}
.p circle{stroke-width:2.5}
.p text{font:800 15px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central}
#ball{transition:transform .45s ease}
.start{transition:opacity .3s}
.side-tag{font:600 10px Barlow,sans-serif;fill:#fff;opacity:.85}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{font:600 1rem Barlow,sans-serif;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:13px 10px;cursor:pointer;min-height:48px}
button.primary{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--court);outline-offset:2px}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 button{flex:1;border-width:1px;font-weight:500}
.status{min-height:3.2em;margin:14px 0 0;font-weight:500}
.parity{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:.98rem}
.parity div+div{margin-top:6px}
.tag{display:inline-block;font:800 .95rem "Barlow Condensed",sans-serif;padding:1px 8px;border-radius:6px;margin-right:4px}
.tag.even{background:var(--court);color:#fff}
.tag.odd{background:var(--ball);color:#13261C}

.checker{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.q{font-weight:600;margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.seg button{border-width:1px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.stepper button{width:56px;flex:none;font-size:1.5rem;padding:6px}
.stepper .num{font-size:3rem;min-width:2ch;text-align:center}
.verdict{border-radius:12px;padding:14px 16px;font-weight:500}
.verdict.ok{background:var(--okBg);color:var(--ok)}
.verdict.bad{background:var(--badBg);color:var(--bad)}
.verdict.wait{background:var(--bg);color:var(--muted)}
.verdict b{display:block;font:800 1.5rem "Barlow Condensed",sans-serif;margin-bottom:2px}

.pocket{border:3px solid var(--ink);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.pocket p{margin:0;font-size:1.1rem}
.pocket .big{font:800 1.7rem/1.05 "Barlow Condensed",sans-serif;margin-bottom:8px}
.pocket svg{width:84px;height:auto}

@media (prefers-reduced-motion: reduce){ .p,#ball,.start{transition:none} }
</style>
</head>
<body>
<main>
  <nav class="langs" aria-label="Language">
    <button data-lang="en" lang="en">EN</button>
    <button data-lang="de" lang="de">DE</button>
    <button data-lang="fr" lang="fr">FR</button>
    <button data-lang="it" lang="it">IT</button>
    <button data-lang="rm" lang="rm">RM</button>
  </nav>

  <h1 data-i="h1"></h1>

      <button id="sideL" aria-pressed="false" data-i="left"></button>

      <button id="minus" aria-label="-">−</button>
      <span class="num" id="chkScore" aria-live="polite">0</span>
      <button id="plus" aria-label="+">+</button>
    </div>
    <div class="verdict wait" id="verdict" aria-live="polite"></div>
  </div>

  <h2 data-i="see"></h2>
  <section class="court-wrap">
    <div class="callout">
      <div>
        <div class="call-label" data-i="callLabel"></div>
        <div class="call" id="call" aria-live="polite">0-0-2</div>
      </div>
      <div class="call-label" id="who" style="text-align:right"></div>
    </div>

    <svg class="court" viewBox="0 0 240 480" role="img">
      <rect width="240" height="480" rx="14" fill="var(--surround)"/>
      <rect x="20" y="20" width="200" height="440" fill="var(--court)"/>
      <rect x="20" y="170" width="200" height="140" fill="var(--kitchen)"/>
      <g stroke="#fff" stroke-width="2" fill="none">
        <rect x="20" y="20" width="200" height="440"/>
        <line x1="20" y1="170" x2="220" y2="170"/>
        <line x1="20" y1="310" x2="220" y2="310"/>
        <line x1="120" y1="20" x2="120" y2="170"/>
        <line x1="120" y1="310" x2="120" y2="460"/>
      </g>
      <line x1="10" y1="240" x2="230" y2="240" stroke="#fff" stroke-width="4"/>
      <line x1="10" y1="240" x2="230" y2="240" stroke="#13261C" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text class="side-tag" x="205" y="452" text-anchor="end" data-i="yourRight"></text>
      <text class="side-tag" x="35" y="34" data-i="theirRight"></text>
      <g class="start" id="startA">
        <circle cx="170" cy="400" r="22" fill="none" stroke="var(--ball)" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="170" y="433" text-anchor="middle" class="side-tag" style="fill:var(--ball);opacity:1" data-i="aStart"></text>
      </g>
      <g class="start" id="startC">
        <circle cx="70" cy="80" r="22" fill="none" stroke="var(--them)" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="70" y="52" text-anchor="middle" class="side-tag" style="fill:var(--them);opacity:1" data-i="cStart"></text>
      </g>
      <g class="p" id="pA"><circle r="16" fill="var(--ball)" stroke="#13261C"/><text fill="#13261C">A</text></g>
      <g class="p" id="pB"><circle r="16" fill="#fff" stroke="#13261C"/><text fill="#13261C">B</text></g>
      <g class="p" id="pC"><circle r="16" fill="var(--them)" stroke="#13261C"/><text fill="#13261C">C</text></g>
      <g class="p" id="pD"><circle r="16" fill="#fff" stroke="#13261C"/><text fill="#13261C">D</text></g>
      <circle id="ball" r="6" fill="var(--ball)" stroke="var(--ballEdge)" stroke-width="1.5"/>
    </svg>

    <div class="controls">
      <button class="primary" id="winUs" data-i="winUs"></button>
      <button id="winThem" data-i="winThem"></button>
    </div>
    <div class="row2">
      <button id="auto" aria-pressed="false"></button>
      <button id="reset" data-i="reset"></button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="parity" id="parity"></div>
  </section>

  <h2 data-i="why"></h2>
  <p data-i="whyP"></p>
  <p class="muted" data-i="whyNote"></p>

  <h2 data-i="pocket"></h2>
  <div class="pocket">
    <div>
      <p class="big"><span data-i="pk1"></span><br><span data-i="pk2"></span></p>
      <p class="muted" data-i="pk3"></p>
    </div>
    <svg viewBox="0 0 84 120" aria-hidden="true">
      <rect x="2" y="2" width="80" height="116" rx="6" fill="var(--court)"/>
      <line x1="42" y1="2" x2="42" y2="118" stroke="#fff" stroke-width="2"/>
      <circle cx="62" cy="36" r="12" fill="var(--ball)" stroke="#13261C" stroke-width="2"/>
      <text x="62" y="70" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="13" data-i="EVEN"></text>
      <circle cx="22" cy="92" r="12" fill="var(--ball)" stroke="#13261C" stroke-width="2"/>
      <text x="22" y="62" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="13" data-i="ODD"></text>
    </svg>
  </div>
</main>

var lang = "en";
function t(k, v){ var s = (T[lang][k] != null ? T[lang][k] : T.en[k]); if(v){ for(var x in v){ s = s.replace("{"+x+"}", v[x]); } } return s; }

function fresh(){ return { us:0, them:0, serving:"us", num:2, server:"A", right:{us:"A",them:"C"}, done:false }; }
function sideOf(p){ return st.right[teamOf[p]] === p ? "right" : "left"; }
function place(el, xy){ el.style.transform = "translate("+xy[0]+"px,"+xy[1]+"px)"; }

function render(){
  ["A","B","C","D"].forEach(function(p){ place(document.getElementById("p"+p), POS[teamOf[p]][sideOf(p)]); });
  var sp = POS[teamOf[st.server]][sideOf(st.server)];
  place(document.getElementById("ball"), [sp[0]+24, sp[1] + (teamOf[st.server]==="us" ? -10 : 10)]);
  var s = st.serving, r = s==="us" ? "them" : "us";
  document.getElementById("call").textContent = st[s]+"-"+st[r]+"-"+st.num;
  document.getElementById("who").textContent = t(s==="us"?"youServe":"theyServe") + ", " + t("server") + " " + st.num;
  document.getElementById("startA").style.opacity = sideOf("A")==="left" ? 1 : 0;
  document.getElementById("startC").style.opacity = sideOf("C")==="left" ? 1 : 0;
  document.getElementById("parity").innerHTML = line("you", st.us, "A") + line("them", st.them, "C");
  document.getElementById("status").textContent = msgKeys.map(function(k){ return t(k); }).join(" ");

}
function line(who, score, p){
  var odd = score % 2 === 1;
  return '<div><span class="tag '+(odd?"odd":"even")+'">'+score+" "+t(odd?"odd":"even")+"</span> "+t(who)+": "+t(odd?"isLeft":"isRight",{p:p})+"</div>";

function rally(w){
  if(st.done){ st = fresh(); msgKeys = ["mNew"]; render(); return; }
  var s = st.serving, r = s==="us" ? "them" : "us";
  if(w === s){ st[s]++; st.right[s] = partner[st.right[s]]; msgKeys = [s==="us"?"mUs":"mThem"]; }
  else if(st.num === 1){ st.num = 2; st.server = partner[st.server]; msgKeys = ["mS1"]; }

  if((st.us>=11 || st.them>=11) && Math.abs(st.us-st.them)>=2){ st.done = true; msgKeys.push("mOver"); }
  render();
}
function stopAuto(){ if(timer){ clearInterval(timer); timer = null; autoBtn.setAttribute("aria-pressed","false"); autoBtn.textContent = t("watch"); } }

document.getElementById("winThem").onclick = function(){ stopAuto(); rally("them"); };
document.getElementById("reset").onclick = function(){ stopAuto(); st = fresh(); msgKeys = ["mNew"]; render(); };
autoBtn.onclick = function(){
  if(timer){ stopAuto(); return; }
  if(st.done){ st = fresh(); }
  timer = setInterval(function(){ rally(Math.random() < .55 ? "us" : "them"); if(st.done) stopAuto(); }, 1700);
  autoBtn.setAttribute("aria-pressed","true"); autoBtn.textContent = t("pause");
};

var side = null, score = 0;
var sideR = document.getElementById("sideR"), sideL = document.getElementById("sideL");
function check(){
  sideR.setAttribute("aria-pressed", side==="right");
  sideL.setAttribute("aria-pressed", side==="left");
  document.getElementById("chkScore").textContent = score;
  var v = document.getElementById("verdict");
  if(!side){ v.className = "verdict wait"; v.textContent = t("pick"); return; }
  var odd = score % 2 === 1;
  if((side==="right") !== odd){ v.className = "verdict ok"; v.innerHTML = "<b>"+t("ok")+"</b>"; return; }
  var opts = [score-1, score+1].filter(function(n){ return n>=0; }).join(" "+t("or")+" ");
  v.className = "verdict bad";
  v.innerHTML = "<b>"+t("bad")+"</b>"+t("must",{need:t(side==="right"?"even":"odd"),opts:opts});
}
sideR.onclick = function(){ side = "right"; check(); };
sideL.onclick = function(){ side = "left"; check(); };
document.getElementById("minus").onclick = function(){ if(score>0) score--; check(); };
document.getElementById("plus").onclick = function(){ if(score<30) score++; check(); };

function setLang(l){
  lang = T[l] ? l : "en";
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang); });
  try{ localStorage.setItem("lang", lang); }catch(e){}
  try{ var u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); }catch(e){}
  render(); check();
}
document.querySelectorAll(".langs button").forEach(function(b){ b.onclick = function(){ setLang(b.getAttribute("data-lang")); }; });

st = fresh();
var start = null;
try{ start = new URLSearchParams(location.search).get("lang"); }catch(e){}
if(!start){ try{ start = localStorage.getItem("lang"); }catch(e){} }
if(!start){ start = (navigator.language || "en").slice(0,2).toLowerCase(); }
setLang(start);
})();
</script>
</body>
