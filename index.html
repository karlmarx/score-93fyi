<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd or even: where to stand in pickleball doubles</title>
<meta name="description" content="Your score tells you which side you should be on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
main{max-width:560px;margin:0 auto;padding:16px 20px 64px}
h1{font-size:clamp(2.6rem,11vw,3.6rem);margin:18px 0 14px}
h2{font-size:2rem;margin:48px 0 12px}
.lede{font-size:1.15rem;font-weight:600}

/* The simulator is one screen tall at most: score on top, court in the middle, buttons at the bottom. */
.sim{display:flex;flex-direction:column;gap:8px;padding:12px;scroll-margin:8px;
  height:calc(100vh - 16px);
  height:min(calc(100svh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),720px)}
.callout{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.call{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.4rem;line-height:1}
.call-label{font-size:.9rem;line-height:1.25;color:var(--muted)}
.who{text-align:right}
.strip{font-size:.9rem;line-height:1.3;text-align:center}
.status{min-height:2.6em;margin:0;font-size:.95rem;line-height:1.3;font-weight:500}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls button{padding:8px 10px;line-height:1.2}
.row2{display:flex;gap:8px}
.row2 button{flex:1;border-width:1px;font-weight:500;font-size:.95rem;min-height:40px;padding:6px 10px;line-height:1.2}
.cta{margin:12px 0 0}
/* Short and wide (a phone on its side): court on the left, everything else beside it. */
@media (max-height:520px){
  .sim{height:auto}
  .sim .court-box{flex:none;height:280px}
}
@media (max-height:520px) and (min-width:600px){
  .sim{display:grid;grid-template-columns:minmax(180px,34%) 1fr;column-gap:16px;align-content:start}
  .sim .court-box{grid-column:1;grid-row:1 / span 6;height:auto;min-height:0}
  .sim > :not(.court-box){grid-column:2}
}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.seg button{border-width:1px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.stepper button{width:56px;flex:none;font-size:1.5rem;padding:6px}
.stepper .num{font-size:3rem;min-width:2ch;text-align:center}
.verdict{border-radius:12px;padding:14px 16px;font-weight:500}
.verdict.ok{background:var(--okBg);color:var(--ok)}
.verdict.bad{background:var(--badBg);color:var(--bad)}
.verdict.wait{background:var(--bg);color:var(--muted)}
.verdict b{display:block;font:800 1.5rem "Barlow Condensed",sans-serif;margin-bottom:2px}

.pocket{border:3px solid var(--ink);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.pocket p{margin:0;font-size:1.1rem}
.pocket .big{font:800 1.7rem/1.05 "Barlow Condensed",sans-serif;margin-bottom:8px}
.pocket svg{width:84px;height:auto}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <a class="navlink" href="/quiz/" data-keep-lang>Quiz →</a>
    <nav class="langs" aria-label="Language">
      <button data-lang="en" lang="en">EN</button>
      <button data-lang="es" lang="es">ES</button>
      <button data-lang="pt" lang="pt">PT</button>
      <button data-lang="de" lang="de">DE</button>
      <button data-lang="fr" lang="fr">FR</button>
      <button data-lang="it" lang="it">IT</button>
    </nav>
  </div>

  <h1 data-i="h1"></h1>
  <p class="lede" data-i="lede"></p>

  <h2 data-i="settle"></h2>
  <div class="card checker">
    <p class="q" data-i="q1"></p>
    <div class="seg" role="group">
      <button id="sideR" aria-pressed="false" data-i="right"></button>
      <button id="sideL" aria-pressed="false" data-i="left"></button>
    </div>
    <p class="q" data-i="q2"></p>
    <div class="stepper">
      <button id="minus" aria-label="-">−</button>
      <span class="num" id="chkScore" aria-live="polite">0</span>
      <button id="plus" aria-label="+">+</button>
    </div>
    <div class="verdict wait" id="verdict" aria-live="polite"></div>
  </div>

  <h2 data-i="see"></h2>
  <section class="card sim" id="sim">
    <div class="callout">
      <div>
        <div class="call-label" data-i="callLabel"></div>
        <div class="call" id="call" aria-live="polite">0-0-2</div>
      </div>
      <div class="call-label who" id="who"></div>
    </div>
    <div class="strip" id="parThem"></div>
    <div class="court-box" id="court"></div>
    <div class="strip" id="parUs"></div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="controls">
      <button class="primary" id="winUs" data-i="winUs"></button>
      <button id="winThem" data-i="winThem"></button>
    </div>
    <div class="row2">
      <button id="auto" aria-pressed="false"></button>
      <button id="reset" data-i="reset"></button>
    </div>
  </section>
  <p class="cta"><a class="btn" href="/quiz/" data-keep-lang data-i="toQuiz"></a></p>

  <h2 data-i="why"></h2>
  <p data-i="whyP"></p>
  <p class="muted" data-i="whyNote"></p>

  <details class="more">
    <summary data-i="mathT"></summary>
    <div class="body" data-ih="mathB"></div>
  </details>
  <details class="more">
    <summary data-i="simpleT"></summary>
    <div class="body" data-ih="simpleB"></div>
  </details>

  <h2 data-i="pocket"></h2>
  <div class="pocket">
    <div>
      <p class="big"><span data-i="pk1"></span><br><span data-i="pk2"></span></p>
      <p class="muted" data-i="pk3"></p>
    </div>
    <svg viewBox="0 0 84 120" aria-hidden="true">
      <rect x="2" y="2" width="80" height="116" rx="6" fill="var(--court)"/>
      <line x1="42" y1="2" x2="42" y2="118" stroke="#fff" stroke-width="2"/>
      <circle cx="62" cy="36" r="12" fill="var(--ball)" stroke="#13261C" stroke-width="2"/>
      <text x="62" y="70" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="13" data-i="EVEN"></text>
      <circle cx="22" cy="92" r="12" fill="var(--ball)" stroke="#13261C" stroke-width="2"/>
      <text x="22" y="62" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="13" data-i="ODD"></text>
    </svg>
  </div>
</main>

<script src="/shared.js"></script>
<script>
(function(){
var PB = window.PB, t = PB.t;
function el(id){ return document.getElementById(id); }

/* ---------- simulator ---------- */
var st = PB.fresh(), msgKeys = ["init"], timer = null;
var sim = el("sim"), autoBtn = el("auto");
var court = PB.mountCourt(el("court"));

function line(who, score, p){
  var odd = score % 2 === 1;
  return '<span class="tag '+(odd?"odd":"even")+'">'+score+" "+t(odd?"odd":"even")+"</span> "+t(who)+": "+t(odd?"isLeft":"isRight",{p:p});
}
function render(){
  court.draw(st);
  el("call").textContent = PB.callOf(st);
  el("who").textContent = t(st.serving==="us"?"youServe":"theyServe") + ", " + t("server") + " " + st.num;
  el("parThem").innerHTML = line("them", st.them, "C");
  el("parUs").innerHTML = line("you", st.us, "A");
  el("status").textContent = msgKeys.map(function(k){ return t(k); }).join(" ");
  autoBtn.textContent = t(timer ? "pause" : "watch");
}
function rally(w){
  if(st.done){ st = PB.fresh(); msgKeys = ["mNew"]; render(); return; }
  var r = PB.step(st, w);
  st = r.st;
  msgKeys = [r.ev==="point" ? (w==="us"?"mUs":"mThem") : r.ev==="second" ? "mS1" : "mOut"];
  if(st.done) msgKeys.push("mOver");
  render();
}
/* Bring the whole simulator on screen, so the score and the buttons are visible together. */
function showSim(){
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  try{ sim.scrollIntoView({block:"nearest", behavior:calm?"auto":"smooth"}); }catch(e){}
}
function stopAuto(){ if(timer){ clearInterval(timer); timer = null; autoBtn.setAttribute("aria-pressed","false"); autoBtn.textContent = t("watch"); } }

el("winUs").onclick = function(){ stopAuto(); showSim(); rally("us"); };
el("winThem").onclick = function(){ stopAuto(); showSim(); rally("them"); };
el("reset").onclick = function(){ stopAuto(); showSim(); st = PB.fresh(); msgKeys = ["mNew"]; render(); };
autoBtn.onclick = function(){
  if(timer){ stopAuto(); return; }
  showSim();
  if(st.done){ st = PB.fresh(); }
  timer = setInterval(function(){ rally(Math.random() < .55 ? "us" : "them"); if(st.done) stopAuto(); }, 1700);
  autoBtn.setAttribute("aria-pressed","true"); autoBtn.textContent = t("pause");
};

/* ---------- checker ---------- */
var side = null, score = 0;
var sideR = el("sideR"), sideL = el("sideL");
function check(){
  sideR.setAttribute("aria-pressed", side==="right");
  sideL.setAttribute("aria-pressed", side==="left");
  el("chkScore").textContent = score;
  var v = el("verdict");
  if(!side){ v.className = "verdict wait"; v.textContent = t("pick"); return; }
  var odd = score % 2 === 1;
  if((side==="right") !== odd){ v.className = "verdict ok"; v.innerHTML = "<b>"+t("ok")+"</b>"; return; }
  var opts = [score-1, score+1].filter(function(n){ return n>=0; }).join(" "+t("or")+" ");
  v.className = "verdict bad";
  v.innerHTML = "<b>"+t("bad")+"</b>"+t("must",{need:t(side==="right"?"even":"odd"),opts:opts});
}
sideR.onclick = function(){ side = "right"; check(); };
sideL.onclick = function(){ side = "left"; check(); };
el("minus").onclick = function(){ if(score>0) score--; check(); };
el("plus").onclick = function(){ if(score<30) score++; check(); };

PB.initLang(function(){ render(); check(); });
})();
</script>
</body>
</html>
